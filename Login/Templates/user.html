<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Page</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap');

        /* Base setup */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            font-family: 'Inter', sans-serif;
            color: #fff;
            padding: 20px;
        }

        .user-container {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            padding: 40px;
            width: 360px;
            text-align: center;
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.4);
            animation: fadeIn 0.8s ease-out;
        }

        h1 {
            margin-bottom: 20px;
            letter-spacing: 1px;
            color: #00ffff;
            text-shadow: 0 0 8px #00ffff80;
        }

        /* Flash message */
        .flash-message {
            margin-bottom: 20px;
            padding: 10px;
            border-radius: 8px;
            background: rgba(255, 0, 0, 0.2);
            color: #ff6b6b;
            font-weight: 600;
            animation: slideDown 0.5s ease;
        }

        /* Form */
        form {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .password-wrapper {
            position: relative;
        }

        input[type="email"],
        input[type="text"],
        input[type="password"],
        input[type="text"].password-visible {
            width: 100%;
            padding: 12px 40px 12px 14px;
            border: none;
            border-radius: 8px;
            outline: none;
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            font-size: 15px;
            transition: all 0.3s ease;
        }

        input::placeholder {
            color: #bbb;
        }

        input:focus {
            background: rgba(255, 255, 255, 0.25);
            box-shadow: 0 0 10px #00ffff80;
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #ccc;
            font-size: 18px;
            cursor: pointer;
            transition: color 0.3s;
        }

        .toggle-password:hover {
            color: #00ffff;
        }

        input[type="submit"] {
            background: #00ffff;
            color: #0f2027;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            transition: 0.3s;
            height: 35px;
            border-radius: 6px;
        }

        input[type="submit"]:hover {
            background: #00d4ff;
            transform: scale(1.05);
        }

        /* Logout link */
        a {
            display: inline-block;
            margin-top: 25px;
            color: #ff6b6b;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s;
        }

        a:hover {
            color: #ff8787;
            text-shadow: 0 0 8px #ff6b6b80;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

<body>
    {% with messages = get_flashed_messages() %}
        {% if messages %}
            {% for msg in messages %}
                <div class="flash-message">{{ msg }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <div class="user-container">

        <h1>Welcome, {{ user }} 👋</h1>

        <form action="" method="post">
            <input type="email" placeholder="Enter Email" name="email" value="{{ email or '' }}">
            
            <div class="password-wrapper">
                <input type="password" id="password" name="password" value="{{ password }}" placeholder="Password">
                <button type="button" class="toggle-password" onclick="togglePassword()">👁️</button>
            </div>

            <input type="submit" value="Update Info">
        </form>

        <a href="/logout">Logout →</a>
    </div>

    <script>
        function togglePassword() {
            const pwd = document.getElementById('password');
            const btn = event.currentTarget;
            if (pwd.type === 'password') {
                pwd.type = 'text';
                btn.textContent = '🙈';
            } else {
                pwd.type = 'password';
                btn.textContent = '👁️';
            }
        }
    </script>
</body>
</html>
