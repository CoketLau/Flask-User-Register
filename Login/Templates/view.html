<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Deletion</title>

    <style>
        /* --- Reset & Base Styles --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f6f8;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 30px;
        }

        h1 {
            margin-bottom: 20px;
            color: #2c3e50;
        }

        /* --- Flash Messages --- */
        .flash-message {
            background-color: #e8f0fe;
            color: #1a73e8;
            padding: 10px 20px;
            margin-bottom: 20px;
            border-radius: 6px;
            border-left: 5px solid #1a73e8;
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        /* --- User List --- */
        .user-list {
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
            padding: 20px;
        }

        .user-item {
            padding: 10px;
            border-bottom: 1px solid #eee;
        }

        .user-item:last-child {
            border-bottom: none;
        }

        .user-item p {
            margin: 5px 0;
        }

        /* --- Delete Form --- */
        form {
            margin-top: 30px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            max-width: 500px;
        }

        input[type="text"] {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 1rem;
        }

        input[type="submit"] {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        input[type="submit"]:hover {
            background-color: #c0392b;
        }
    </style>
</head>

<body>
    <h1>Data Base</h1>

    <!-- Flash messages -->
    {% with messages = get_flashed_messages() %}
        {% if messages %}
            {% for msg in messages %}
                <div class="flash-message">{{ msg }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <!-- List of users -->
    <div class="user-list">
        {% for item in values %}
            <div class="user-item">
                <p><strong>Name:</strong> {{ item.name }}</p>
                <p><strong>Email:</strong> {{ item.email }}</p>
            </div>
        {% endfor %}
    </div>

    <a href="/delete">Delete users</a>
</body>
</html>
