<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete User</title>

    <style>
        /* --- Reset & Base Styles --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f6f8;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 20px;
        }

        /* --- Flash Messages --- */
        .flash {
            width: 100%;
            max-width: 400px;
            padding: 12px 18px;
            margin-bottom: 15px;
            border-radius: 6px;
            font-weight: 500;
            text-align: center;
        }

        .flash.info {
            background-color: #e8f0fe;
            color: #1a73e8;
            border-left: 5px solid #1a73e8;
        }

        .flash.success {
            background-color: #e6f4ea;
            color: #188038;
            border-left: 5px solid #188038;
        }

        .flash.warning {
            background-color: #fff4e5;
            color: #b06000;
            border-left: 5px solid #b06000;
        }

        .flash.danger {
            background-color: #fdecea;
            color: #d93025;
            border-left: 5px solid #d93025;
        }

        /* --- Form Styling --- */
        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: #fff;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }

        input[type="text"] {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            border-color: #1a73e8;
            outline: none;
        }

        input[type="submit"] {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        input[type="submit"]:hover {
            background-color: #c0392b;
        }

        /* --- Back Link --- */
        a {
            display: inline-block;
            margin-top: 20px;
            color: #1a73e8;
            text-decoration: none;
            font-weight: 500;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <h1>Delete User</h1>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="flash {{ category }}">{{ message }}</div>
        {% endfor %}
    {% endwith %}

    <form action="" method="post">
        <input type="text" name="user" placeholder="Delete user:" required>
        <input type="submit" value="SUBMIT">
    </form>

    <a href="/view">← Back to User List</a>
</body>
</html>
