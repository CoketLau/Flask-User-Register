<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>

    <style>
        body {
            background: linear-gradient(135deg, #1a1f3b, #280e5c);
            font-family: "Poppins", sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
            margin: 0;
            color: white;
        }

        .container {
            background: rgba(255, 255, 255, 0.08);
            padding: 30px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 25px rgba(0,0,0,0.4);
            text-align: center;
            width: 320px;
        }

        input, select {
            width: 85%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 10px;
            border: none;
            outline: none;
            background: rgba(255, 255, 255, 0.2);
            color: rgb(0, 0, 0);
            font-size: 1em;
        }

        button {
            width: 85%;
            padding: 12px;
            border-radius: 12px;
            border: none;
            background: #3ef5c3;
            color: black;
            font-size: 1.1em;
            cursor: pointer;
            transition: 0.2s;
            font-weight: bold;
        }

        button:hover {
            background: #27cda4;
            transform: scale(1.05);
        }

        #resultado {
            margin-top: 15px;
            font-size: 2em;
            font-weight: bold;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            padding: 10px;
            min-height: 45px;
            color: #3ef5c3;
        }

        footer {
            position: fixed;
            bottom: 10px;
            width: 100%;
            text-align: center;
            font-size: 0.9em;
            color: #b8b8b8;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Calculadora 🌙</h2>

        <input type="number" id="first" placeholder="Primer número">

        <select id="Simbolo">
            <option value="mas">+</option>
            <option value="menos">-</option>
            <option value="por">*</option>
            <option value="dividido">/</option>
        </select>

        <input type="number" id="second" placeholder="Segundo número">

        <button type="button" id="boton">Calcular</button>

        <p id="resultado"></p>
    </div>

    <footer>Made by Lauret ✨</footer>

    <script>
        const boton = document.getElementById("boton");
        const resultado = document.getElementById("resultado");
        const simbolo = document.getElementById("Simbolo");
        const first = document.getElementById("first");
        const second = document.getElementById("second");

        boton.addEventListener("click", function() {
            if (first.value === "" || second.value === "") {
                resultado.textContent = "Completa los campos";
                resultado.style.color = "#ff5757";
                return;
            }

            let res;
            resultado.style.color = "#3ef5c3";

            if (simbolo.value == "mas") res = Number(first.value) + Number(second.value);
            else if (simbolo.value == "menos") res = Number(first.value) - Number(second.value);
            else if (simbolo.value == "por") res = Number(first.value) * Number(second.value);
            else if (simbolo.value == "dividido") {
                if (Number(second.value) === 0) {
                    resultado.textContent = "No se divide por 0 🤨";
                    resultado.style.color = "#ff5757";
                    return;
                }
                res = Number(first.value) / Number(second.value);
            }

            resultado.textContent = res;
        });
    </script>

</body>
</html>
