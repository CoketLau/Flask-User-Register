<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Cripter</title>

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #1e1e2e, #3a0ca3);
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.08);
            padding: 40px 50px;
            border-radius: 15px;
            backdrop-filter: blur(8px);
            box-shadow: 0 0 20px rgba(0,0,0,0.4);
        }

        h1 {
            margin-bottom: 20px;
            font-size: 2.2rem;
        }

        p {
            margin-bottom: 25px;
            font-size: 1.2rem;
        }

        a {
            display: inline-block;
            margin: 10px;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.2s;
            background-color: #4cc9f0;
            color: #1e1e2e;
        }

        a:hover {
            background-color: #00b4d8;
            transform: scale(1.08);
        }
    </style>

</head>
<body>
    <div class="container">
        <h1>The Cripter</h1>
        <p>Choose an action</p>

        <a href="/encript">Encrypt</a>
        <a href="/decript">Decrypt</a>
    </div>
</body>
</html>
