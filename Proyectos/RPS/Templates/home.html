<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>

    <style>
        body {
            font-family: "Segoe UI", Arial, sans-serif;
            text-align: center;
            margin-top: 100px;
            background-color: #111;
            color: #fff;
        }

        h1 {
            font-size: 48px;
            margin-bottom: 40px;
            letter-spacing: 2px;
        }

        a.choice {
            display: inline-block;
            margin: 15px;
            padding: 14px 28px;
            font-size: 20px;
            text-decoration: none;
            border: 2px solid #00eaff;
            border-radius: 8px;
            cursor: pointer;
            color: #00eaff;
            transition: 0.3s ease-in-out;
        }

        a.choice:hover {
            background-color: #00eaff;
            color: #111;
            box-shadow: 0 0 15px #00eaff;
            transform: scale(1.1);
        }
    </style>

</head>
<body>

    <h1>Choose</h1>

    <a class="choice" href="http://127.0.0.1:5000/Play/Rock">Rock</a>
    <a class="choice" href="http://127.0.0.1:5000/Play/Paper">Paper</a>
    <a class="choice" href="http://127.0.0.1:5000/Play/Scissors">Scissors</a>

</body>
</html>
