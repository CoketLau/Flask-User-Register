<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The-Cripter | Decrypt</title>

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #1e1e2e, #3a0ca3);
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.08);
            padding: 40px 50px;
            border-radius: 15px;
            backdrop-filter: blur(8px);
            box-shadow: 0 0 20px rgba(0,0,0,0.4);
            width: 350px;
        }

        h1 {
            margin-bottom: 20px;
            font-size: 2rem;
        }

        p {
            margin-bottom: 15px;
            font-size: 1.2rem;
        }

        input[type="text"] {
            width: 90%;
            padding: 10px;
            border-radius: 8px;
            border: none;
            outline: none;
            margin-bottom: 20px;
            font-size: 1rem;
        }

        input[type="submit"] {
            background-color: #ffc300;
            color: #1e1e2e;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        input[type="submit"]:hover {
            background-color: #ffba08;
            transform: scale(1.08);
        }

        #Output {
            margin-top: 20px;
            padding: 12px;
            background: rgba(0,0,0,0.3);
            border-radius: 10px;
            font-size: 1.1rem;
            word-break: break-all;
        }

        a.back {
            display: inline-block;
            margin-top: 15px;
            color: #4cc9f0;
            font-weight: bold;
            text-decoration: none;
        }

        a.back:hover {
            text-decoration: underline;
        }
    </style>

</head>
<body>
    <div class="container">
        <h1>The Cripter</h1>
        <p>Decrypt:</p>

        <form action="" method="post">
            <input type="text" required name="text" placeholder="Enter text to decrypt...">
            <input type="submit" value="Decrypt">
        </form>

        {% if output is defined %}
            <p id="Output">{{ output }}</p>
        {% endif %}

        <a href="/" class="back">⬅ Back</a>
    </div>
</body>
</html>
